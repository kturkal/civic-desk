<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Desk</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="frame" class="panel-open">
    <header id="tabbar">
      <div class="lights">
        <button class="light close" id="btn-close" aria-label="Close"></button>
        <button class="light min" id="btn-min" aria-label="Minimize"></button>
        <button class="light zoom" id="btn-zoom" aria-label="Zoom"></button>
      </div>
      <div id="tabs" role="tablist"></div>
      <button id="new-tab" aria-label="New tab" title="New tab (Cmd+T)">+</button>
    </header>

    <main id="page-wrap">
      <article id="editor" contenteditable="true" spellcheck="true" data-placeholder="Start writing..."></article>
    </main>

    <footer id="status"><span id="count">0 words</span></footer>

    <!-- Collapsed: a circle. Open: a panel. Both share the civic blue border. -->
    <button id="fab" class="half" aria-label="Open format panel" title="Format">Aa</button>

    <!-- Collapse: a semicircle growing out of the panel's top-right corner. Lives outside the
         panel because the panel scrolls (and so clips anything that sticks out). -->
    <button id="collapse" class="half" aria-label="Collapse format panel" title="Collapse"><span>&rsaquo;</span></button>

    <aside id="panel" aria-label="Format">
      <div class="panel-head">
        <span>Format</span>
      </div>

      <div class="group">
        <div class="label">Font</div>
        <button id="font-btn" class="font-btn" aria-haspopup="listbox" aria-expanded="false">Georgia</button>
        <div id="font-pop" hidden>
          <ul id="font-list" role="listbox"></ul>
          <input id="font-add" type="text" placeholder="Add a Google Font…" aria-label="Add a Google Font by name" autocomplete="off" spellcheck="false" />
        </div>
      </div>

      <div class="group">
        <div class="label">Style</div>
        <div class="stack">
          <button data-cmd="formatBlock" data-val="h1">Title</button>
          <button data-cmd="formatBlock" data-val="h2">Heading</button>
          <button data-cmd="formatBlock" data-val="p">Body</button>
          <button data-cmd="formatBlock" data-val="blockquote">Quote</button>
        </div>
      </div>

      <div class="group">
        <div class="label">Text</div>
        <div class="row">
          <button data-cmd="bold" title="Bold"><b>B</b></button>
          <button data-cmd="italic" title="Italic"><i>I</i></button>
          <button data-cmd="underline" title="Underline"><u>U</u></button>
          <button data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
        </div>
      </div>

      <div class="group">
        <div class="label">Lists</div>
        <div class="row">
          <button data-cmd="insertUnorderedList" title="Bulleted list">&bull; List</button>
          <button data-cmd="insertOrderedList" title="Numbered list">1. List</button>
        </div>
      </div>

      <div class="group">
        <div class="label">Align</div>
        <div class="row">
          <button data-cmd="justifyLeft" title="Align left">Left</button>
          <button data-cmd="justifyCenter" title="Center">Center</button>
          <button data-cmd="justifyRight" title="Align right">Right</button>
        </div>
      </div>

      <div class="group">
        <div class="label">History</div>
        <div class="row">
          <button data-cmd="undo" title="Undo">Undo</button>
          <button data-cmd="redo" title="Redo">Redo</button>
        </div>
      </div>
    </aside>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
